name: Build DevBox image

on:
  # Every branch push builds its own image variant; version tags (v*) and
  # workflow_dispatch (any branch) too.
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub pushes are optional and happen only when BOTH secrets are set:
  #   DOCKERHUB_USERNAME - Docker Hub account or org name
  #   DOCKERHUB_TOKEN    - Docker Hub access token with read/write scope
  # Without them, images go to GHCR only. Unlike GHCR, Docker Hub does not
  # auto-create repositories on first push: the target repo
  # (<username>/opencode-dev-sandbox) must exist up front.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-amd64:
    name: Build · linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Branch slug
        # GITHUB_REF_NAME is the branch (or v-tag) name; normalize it into a
        # valid Docker tag so e.g. feature/x becomes feature-x.
        id: slug
        run: |
          SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # Always, not just pushes: PRs restore the registry build cache and
        # GITHUB_TOKEN reads/writes packages in this repo.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Only when Docker Hub credentials are configured; otherwise GHCR-only.
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build refs
        id: refs
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          SLUG="${{ steps.slug.outputs.slug }}"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "arch=${IMG}:${SLUG}-linux-amd64" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG}:cache-${SLUG}-amd64" >> "$GITHUB_OUTPUT"
          # Only add Docker Hub targets when both Docker Hub secrets are set.
          DHIMG=""
          if [[ "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}" == "true" ]]; then
            DHIMG="$(printf '%s' "${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          fi
          echo "dharch=${DHIMG:+${DHIMG}:${SLUG}-linux-amd64}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.refs.outputs.arch }}
            ${{ steps.refs.outputs.dharch }}
          # Registry-backed cache via GHCR: no 10 GB Actions-cache cap. Each
          # arch and branch keeps its own ref so concurrent jobs never race the
          # same cache manifest. Import is best-effort; export runs only on
          # non-PR runs so an unmerged PR never overwrites cache that branch
          # builds from.
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.refs.outputs.cache) || '' }}

  build-arm64:
    name: Build · linux/arm64
    # Native ARM64 hosted runner: no QEMU emulation needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Branch slug
        id: slug
        run: |
          SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Only when Docker Hub credentials are configured; otherwise GHCR-only.
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build refs
        id: refs
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          SLUG="${{ steps.slug.outputs.slug }}"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "arch=${IMG}:${SLUG}-linux-arm64" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG}:cache-${SLUG}-arm64" >> "$GITHUB_OUTPUT"
          # Only add Docker Hub targets when both Docker Hub secrets are set.
          DHIMG=""
          if [[ "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}" == "true" ]]; then
            DHIMG="$(printf '%s' "${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          fi
          echo "dharch=${DHIMG:+${DHIMG}:${SLUG}-linux-arm64}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.refs.outputs.arch }}
            ${{ steps.refs.outputs.dharch }}
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.refs.outputs.cache) || '' }}

  merge:
    name: Merge multi-arch tags
    # Nothing is pushed on PRs (the build jobs gate `push`), so there is no
    # per-arch manifest to merge into multi-arch tags.
    if: github.event_name != 'pull_request'
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Branch slug
        id: slug
        run: |
          SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Only when Docker Hub credentials are configured; otherwise GHCR-only.
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge arch manifests into multi-arch tags
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          SLUG="${{ steps.slug.outputs.slug }}"
          # Only add Docker Hub targets when both Docker Hub secrets are set.
          DHIMG=""
          if [[ "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}" == "true" ]]; then
            DHIMG="$(printf '%s' "${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          fi
          # Every branch publishes its own variant tag (de-systemd, feature-x, ...).
          TARGETS="${IMG}:${SLUG}${DHIMG:+ ${DHIMG}:${SLUG}}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # v1.2.3 additionally publishes the bare version number.
            TARGETS="${TARGETS} ${IMG}:${GITHUB_REF_NAME#v}${DHIMG:+ ${DHIMG}:${GITHUB_REF_NAME#v}}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGETS="${TARGETS} ${IMG}:latest ${IMG}:main${DHIMG:+ ${DHIMG}:latest ${DHIMG}:main}"
          fi
          for t in $TARGETS; do
            docker buildx imagetools create -t "$t" "$IMG:${SLUG}-linux-amd64" "$IMG:${SLUG}-linux-arm64"
          done