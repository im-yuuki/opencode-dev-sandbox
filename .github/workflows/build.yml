name: Build DevBox image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-amd64:
    name: Build · linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        # Always, not just pushes: PRs restore the registry build cache and
        # GITHUB_TOKEN reads/writes packages in this repo.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build refs
        id: refs
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "arch=${IMG}:linux-amd64" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG}:buildcache-amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.refs.outputs.arch }}
          # Registry-backed cache via GHCR: no 10 GB Actions-cache cap. Each
          # arch keeps its own ref so the concurrent jobs never race the same
          # cache manifest. Import is best-effort; export runs only on non-PR
          # runs so an unmerged PR never overwrites the cache main builds from.
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.refs.outputs.cache) || '' }}

  build-arm64:
    name: Build · linux/arm64
    # Native ARM64 hosted runner: no QEMU emulation needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build refs
        id: refs
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "arch=${IMG}:linux-arm64" >> "$GITHUB_OUTPUT"
          echo "cache=${IMG}:buildcache-arm64" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.refs.outputs.arch }}
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.refs.outputs.cache) || '' }}

  merge:
    name: Merge multi-arch tags
    # Nothing is pushed on PRs (the build jobs gate `push`), so there is no
    # per-arch manifest to merge into multi-arch tags.
    if: github.event_name != 'pull_request'
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge arch manifests into multi-arch tags
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          TARGETS="${IMG}:latest"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TARGETS="${TARGETS} ${IMG}:${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGETS="${TARGETS} ${IMG}:main"
          fi
          for t in $TARGETS; do
            docker buildx imagetools create -t "$t" "$IMG:linux-amd64" "$IMG:linux-arm64"
          done