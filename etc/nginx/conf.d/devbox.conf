# One port, HTTPS only. The certificate is self-signed and written on first boot
# by scripts/entrypoint.sh (persisted under /workspace/.devbox/tls); that runs
# before supervisord execs, so the files always exist by the time nginx starts.
server {
    listen 9080 ssl default_server;
    server_name _;

    ssl_certificate /workspace/.devbox/tls/devbox.crt;
    ssl_certificate_key /workspace/.devbox/tls/devbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Plain HTTP to the TLS port: nginx answers 497. Bounce it to https on
    # whatever host:port the browser used ($http_host keeps the published host
    # port, which is not 9080).
    error_page 497 = @to_https;
    location @to_https { return 301 https://$http_host$request_uri; }

    client_max_body_size 0;

    # The published host port is chosen at `docker run -p <host>:9080`, so the
    # gateway must never emit its own listen port in a redirect. Relative
    # Location headers keep whatever host:port the browser actually used.
    absolute_redirect off;
    port_in_redirect off;

    # ---- 4xx/5xx -> SPA error page, which reads ?code=NNN ----
    # External redirect, not an internal rewrite: the SPA router runs with
    # basename=/launcher, so serving index.html while the address bar still
    # said /vnc/ would match no route. Each code gets its own named location
    # because $status is not dependable inside an error_page target.
    #
    # proxy_intercept_errors stays off (the default), so this only catches what
    # nginx itself produces: auth_request 401 and 502/503/504 for a dead
    # upstream. Application errors from the API, Cockpit or OpenChamber still
    # reach their own clients untouched.
    error_page 401 = @err_401;
    error_page 403 = @err_403;
    error_page 404 = @err_404;
    error_page 500 = @err_500;
    error_page 502 = @err_502;
    error_page 503 = @err_503;
    error_page 504 = @err_504;

    # 401 also carries the blocked address so the login form can return there.
    # $request_uri is passed raw (nginx has no urlencode), so `from` must stay
    # last: the SPA takes everything after it, query string included.
    location @err_401 { return 302 /launcher/error?code=401&from=$request_uri; }
    location @err_403 { return 302 /launcher/error?code=403; }
    location @err_404 { return 302 /launcher/error?code=404; }
    location @err_500 { return 302 /launcher/error?code=500; }
    location @err_502 { return 302 /launcher/error?code=502; }
    location @err_503 { return 302 /launcher/error?code=503; }
    location @err_504 { return 302 /launcher/error?code=504; }

    # ---- internal auth gate: validates the session cookie against the API ----
    # 2xx => allowed, 401 => blocked, which the error_page rules above turn into
    # a redirect to the SPA error page (whose 401 view links to the login form).
    location = /devbox-auth {
        internal;
        proxy_pass http://127.0.0.1:9102/api/v1/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # ---- DevBox control API (PAM auth + service toggles, sessions) ----
    # Lives under /launcher/api (not /api) because OpenChamber owns /api at the
    # root; the prefix is stripped here so the control plane keeps serving its
    # own /api/v1/* routes. error_page is reset: fetch() callers parse the JSON
    # error body, and the SPA's own 401 handling depends on seeing the status,
    # not a redirect.
    location /launcher/api/ {
        error_page 401 403 404 500 502 503 504 = @api_error;
        proxy_pass http://127.0.0.1:9102/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }

    # Only reached when the control plane itself is unreachable; the API's own
    # responses pass straight through.
    location @api_error {
        internal;
        default_type application/json;
        return 503 '{"error":"control plane unavailable"}';
    }

    # noVNC resize settings are deployment policy. Keep these JSON files out
    # of browser/reverse-proxy caches so remote origins cannot retain the
    # package's old empty configuration after an image upgrade.
    location = /vnc/defaults.json {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9103/defaults.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /vnc/mandatory.json {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9103/mandatory.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /vnc/vnc.html {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9103/vnc.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /vnc/vnc_auto.html {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9103/vnc_auto.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ---- noVNC (KDE desktop) ----
    location /vnc/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9103/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 61s;
        proxy_buffering off;
    }

    # ---- VS Code web (code-server) ----
    location /code/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9101/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    location = /code {
        return 302 /code/;
    }

    # ---- Cloud Commander file manager ----
    # The service is loopback-only and has its own auth disabled. DevBox's
    # session gate is the single authentication layer for the file system.
    location /files/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
    location = /files {
        return 302 /files/;
    }

    # ---- DevBox web UI (SPA) - public shell; auth enforced in-app ----
    # error_page is reset to nginx defaults here: this location *serves* the
    # error page, so redirecting its own misses would loop.
    location /launcher/ {
        error_page 404 = @ui_404;
        root /var/www;
        index index.html;
        try_files $uri $uri/ /launcher/index.html;
    }
    location @ui_404 {
        internal;
        return 404 "not found\n";
    }
    location = /launcher {
        return 302 /launcher/;
    }

    # ---- legacy /ui -> /launcher (pre-remap bookmarks) ----
    location /ui/ {
        rewrite ^/ui/(.*)$ /launcher/$1 permanent;
    }
    location = /ui {
        return 302 /launcher/;
    }

    # ---- OpenChamber lives at the root; the SPA bootstraps auth in-app ----
    location / {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # strip nginx-injected auth headers so OpenChamber doesn't over-parse them
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
