server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 0;

    # ---- internal auth gate: validates the session cookie against the API ----
    # 2xx => allowed, 401 => blocked (frontend shows its own login page).
    location = /devbox-auth {
        internal;
        proxy_pass http://127.0.0.1:3100/api/v1/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # ---- DevBox control API (PAM auth + service toggles, sessions) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }

    # ---- noVNC (KDE desktop) ----
    location /vnc/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 61s;
        proxy_buffering off;
    }

    # ---- ttyd standalone web terminal ----
    location /terminal/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:7681/terminal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    location = /terminal {
        return 302 /terminal/;
    }

    # ---- cockpit (web admin) ----
    location /cockpit/ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9090/cockpit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
    }
    location /cockpit+ {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        gzip off;
    }

    # ---- DevBox web UI (SPA) - public shell; auth enforced in-app ----
    location /ui/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }
    location = /ui {
        return 302 /ui/;
    }

    # ---- OpenChamber lives at the root; the SPA bootstraps auth in-app ----
    location / {
        auth_request /devbox-auth;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # strip nginx-injected auth headers so OpenChamber doesn't over-parse them
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}