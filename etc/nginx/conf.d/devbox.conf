# Two listeners, same routing table:
#   :80  plaintext HTTP
#   :443 TLS, self-signed certificate written on first boot by
#        scripts/entrypoint.sh (persisted under /workspace/.devbox/tls); that
#        runs before supervisord execs, so the files always exist by the time
#        nginx starts.
#
# Port 80 is served, not redirected: the two ports are published independently
# (`-p 8080:80 -p 8443:443`), so nginx cannot know which host port maps to 443
# and would emit a broken redirect target. Clients that want TLS ask for the
# https port directly.
#
# Everything shared lives in snippets/devbox-routes.conf; keep this file to
# listener and TLS concerns only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/devbox-routes.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /workspace/.devbox/tls/devbox.crt;
    ssl_certificate_key /workspace/.devbox/tls/devbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/devbox-routes.conf;
}
