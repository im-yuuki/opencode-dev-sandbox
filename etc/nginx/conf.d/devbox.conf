server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 0;

    # ---- landing page (basic-auth) ----
    location = /start/ {
        auth_basic "DevBox";
        auth_basic_user_file /etc/nginx/htpasswd;
        root /opt/www;
        try_files /index.html =404;
    }
    location = /start {
        return 302 /start/;
    }

    # ---- noVNC (KDE desktop) ----
    location /vnc/ {
        auth_basic "DevBox";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 61s;
        proxy_buffering off;
    }

    # ---- cockpit (web admin + terminal); own PAM login, no nginx gate ----
    location /cockpit/ {
        proxy_pass http://127.0.0.1:9090/cockpit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
    }
    location /cockpit+ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        gzip off;
    }

    # ---- ttyd (standalone web terminal) ----
    location /terminal/ {
        auth_basic "DevBox";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://127.0.0.1:7681/terminal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    location = /terminal {
        return 302 /terminal/;
    }

    # ---- everything else -> OpenChamber (needs root for its assets) ----
    location / {
        auth_basic "DevBox";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Nginx already authenticated this request; do NOT leak the Basic
        # Authorization header upstream or OpenChamber mistakes it for its
        # own credential and hard-401s the UI.
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}