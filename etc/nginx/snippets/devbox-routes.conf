# Shared routing table for the DevBox gateway. Included by both the port 80
# (plaintext) and port 443 (TLS) server blocks in conf.d/devbox.conf so the two
# listeners never drift apart. Nothing in here may mention a scheme or a port:
# every proxied upstream gets $scheme / $http_host from the live request.

client_max_body_size 0;

# The published host ports are chosen at `docker run -p <host>:80 -p <host>:443`,
# so the gateway must never emit its own listen port in a redirect. Relative
# Location headers keep whatever host:port the browser actually used.
absolute_redirect off;
port_in_redirect off;

# ---- only the not-logged-in case is bounced to the SPA login flow ----
# A request that fails auth_request gets an nginx-generated 401 (internal
# subrequest), and that single code is redirected to the SPA error page, whose
# 401 view links to the login form. External redirect, not an internal rewrite:
# the SPA router runs with basename=/launcher, so serving index.html while the
# address bar still said /vnc/ would match no route.
#
# proxy_intercept_errors stays off (the default), and there is no error_page
# for any other code here, so every other failure belongs to the app that was
# asked: a dead or failing upstream (502/503/504), an app's own 4xx/5xx (a 404,
# a 403, a 500 body the app produced) all pass straight through to the client,
# exactly as the application returned them.
error_page 401 = @err_401;

# The 401 carries the blocked address so the login form can return there.
# $request_uri is passed raw (nginx has no urlencode), so `from` must stay
# last: the SPA takes everything after it, query string included.
location @err_401 { return 302 /launcher/error?code=401&from=$request_uri; }

# ---- internal auth gate: validates the session cookie against the API ----
# 2xx => allowed, 401 => blocked, which the error_page rule above turns into
# a redirect to the SPA error page (whose 401 view links to the login form).
location = /devbox-auth {
    internal;
    proxy_pass http://127.0.0.1:9102/api/v1/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

# ---- DevBox control API (PAM auth + service toggles, sessions) ----
# Lives under /launcher/api (not /api) because OpenChamber owns /api at the
# root; the prefix is stripped here so the control plane keeps serving its
# own /api/v1/* routes. error_page is reset: fetch() callers parse the JSON
# error body, and the SPA's own 401 handling depends on seeing the status,
# not a redirect.
#
# X-Forwarded-Proto decides whether the session cookie is issued with the
# Secure attribute: on the plaintext listener a Secure cookie would never be
# sent back, so login would appear to succeed and then immediately fail.
location = /launcher/api/v1/metrics/stream {
    error_page 401 403 404 500 502 503 504 = @api_error;
    proxy_pass http://127.0.0.1:9102/api/v1/metrics/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location /launcher/api/ {
    error_page 401 403 404 500 502 503 504 = @api_error;
    proxy_pass http://127.0.0.1:9102/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 60s;
}

# Only reached when the control plane itself is unreachable; the API's own
# responses pass straight through.
location @api_error {
    internal;
    default_type application/json;
    return 503 '{"error":"control plane unavailable"}';
}

# noVNC resize settings are deployment policy. Keep these JSON files out
# of browser/reverse-proxy caches so remote origins cannot retain the
# package's old empty configuration after an image upgrade.
location = /vnc/defaults.json {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9103/defaults.json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
location = /vnc/mandatory.json {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9103/mandatory.json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
location = /vnc/vnc.html {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9103/vnc.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
location = /vnc/vnc_auto.html {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9103/vnc_auto.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ---- noVNC (LXQt desktop) ----
location /vnc/ {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9103/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 61s;
    proxy_buffering off;
}

# ---- VS Code web (code-server) ----
location /code/ {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9101/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
location = /code {
    return 302 /code/;
}

# ---- FileBrowser Quantum file manager ----
# The service is loopback-only and has its own auth disabled. DevBox's
# session gate is the single authentication layer for the file system.
#
# The prefix is *not* stripped: FileBrowser runs with baseURL "/files", so it
# expects to see the full path and generates its own asset/API URLs under it.
# Note the upstream has no trailing slash for the same reason.
location /files/ {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9104;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    # No forced `Connection: upgrade`: FileBrowser Quantum pushes progress over
    # SSE, and pinning the header would corrupt ordinary keepalive requests.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
location = /files {
    return 302 /files/;
}

# ---- CLIProxyAPI Management Center ----
# Deliberately narrow: only the panel, its management API and the plugin
# resources are public. The /v1/ proxy surface is never exposed through the
# gateway -- in-container agents reach it at http://127.0.0.1:8317 directly.
#
# These must stay above the OpenChamber catch-all below. The Authorization
# header is forwarded verbatim because the panel sends the management key as a
# Bearer token; nginx never injects or rewrites that key.
location = /management.html {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:8317/management.html;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
}
location /v0/management/ {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:8317/v0/management/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # CLIProxyAPI's allow-remote=false policy must see nginx as a local
    # client. Forwarding the browser's address here makes the proxy reject
    # the otherwise valid management key with 403 before auth is evaluated.
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    # Log tails and request-status endpoints stream; buffering would stall them.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location /v0/resource/plugins/ {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:8317/v0/resource/plugins/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# ---- DevBox web UI (SPA) - public shell; auth enforced in-app ----
# error_page is reset to nginx defaults here: this location *serves* the
# error page, so redirecting its own misses would loop.
location /launcher/ {
    error_page 404 = @ui_404;
    root /var/www;
    index index.html;
    try_files $uri $uri/ /launcher/index.html;
}
location @ui_404 {
    internal;
    return 404 "not found\n";
}
location = /launcher {
    return 302 /launcher/;
}

# ---- legacy /ui -> /launcher (pre-remap bookmarks) ----
location /ui/ {
    rewrite ^/ui/(.*)$ /launcher/$1 permanent;
}
location = /ui {
    return 302 /launcher/;
}

# ---- OpenChamber lives at the root; the SPA bootstraps auth in-app ----
location / {
    auth_request /devbox-auth;
    proxy_pass http://127.0.0.1:9100;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    # strip nginx-injected auth headers so OpenChamber doesn't over-parse them
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
