# PID1 supervisor (replaces systemd). Programs live in conf.d/*.conf.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
; Root-only. The control API runs as root and drives supervisorctl on the
; user's behalf; a uid-1000 process must not be able to stop nginx or the
; control plane directly. Escalation goes through real sudo.
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf