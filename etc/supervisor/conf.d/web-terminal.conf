; Persistent terminal broker. tmux sessions outlive this attachment service.
[program:web-terminal]
command=/usr/local/bin/devbox-user-env /usr/bin/python3 /opt/devbox/backend/terminal_broker.py
user=user
directory=/workspace
environment=HOME="/workspace",XDG_RUNTIME_DIR="/run/user/1000"
autostart=false
autorestart=true
startsecs=2
startretries=5
stopwaitsecs=8
# Never signal a tmux server or shell process group when only the broker is
# stopped; tmux sessions are the persistence layer.
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
