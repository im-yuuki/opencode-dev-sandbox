; opencode-dev-sanbox control plane: PAM auth, sessions, service toggles.
; Runs as root (reads /etc/shadow for PAM) and drives supervisorctl.
[program:devbox-api]
command=/usr/bin/env python3 /opt/devbox/backend/server.py
environment=DEVBOX_USER="user",DEVBOX_BIND="127.0.0.1",DEVBOX_PORT="9102"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
