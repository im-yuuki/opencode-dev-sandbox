; Docker-in-Docker (vfs storage driver via /etc/docker/daemon.json).
; Needs --privileged at container run time.
[program:docker]
command=/usr/bin/dockerd
autostart=false
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
