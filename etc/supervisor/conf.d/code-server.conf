; VS Code web (code-server) for user. Loopback only; nginx PAM-gates /code/.
[program:code-server]
command=/usr/local/bin/code-server --bind-addr 127.0.0.1:3001 --auth none --disable-telemetry --disable-update-check
user=user
directory=/workspace
environment=HOME="/workspace",SHELL="/bin/bash",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true