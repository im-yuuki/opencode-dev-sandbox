; CLIProxyAPI + Management Center. Binds 127.0.0.1:8317 so in-container agents
; can use the documented upstream base URL unchanged; nginx exposes only the
; management routes (/management.html, /v0/management/, /v0/resource/plugins/),
; never the /v1/ proxy surface.
[program:cliproxyapi]
command=/usr/local/bin/devbox-user-env /usr/local/bin/cliproxyapi --config /workspace/.devbox/cliproxy/config.yaml
user=user
directory=/workspace/.devbox/cliproxy
environment=HOME="/workspace",SHELL="/bin/bash",MANAGEMENT_STATIC_PATH="/opt/cliproxy/static"
autostart=false
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
