; FileBrowser Quantum file manager (replaces Cloud Commander). Loopback-only
; with its own auth disabled; nginx PAM-gates /files/ and is the single
; authentication layer in front of the workspace.
[program:filebrowser]
command=/usr/local/bin/devbox-user-env /usr/local/bin/filebrowser -c /workspace/.devbox/filebrowser/config.yaml
user=user
directory=/workspace
environment=HOME="/workspace",SHELL="/bin/bash"
autostart=false
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
