; OpenChamber (OpenCode web UI). Loopback only; nginx PAM-gates it.
[program:openchamber]
command=/usr/bin/openchamber serve --foreground --port 9100
user=user
directory=/workspace
environment=HOME="/workspace",XDG_RUNTIME_DIR="/run/user/1000",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
