; OpenChamber (= the "Agent" application): the core of DevBox, always on.
[program:openchamber]
command=/usr/local/bin/devbox-user-env /usr/bin/openchamber serve --foreground --port 9100
user=user
directory=/workspace
environment=HOME="/workspace",XDG_RUNTIME_DIR="/run/user/1000"
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
