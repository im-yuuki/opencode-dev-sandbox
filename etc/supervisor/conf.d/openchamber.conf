; OpenChamber (= the "Agent" application). Starts and stops like any other app
; from the dashboard; if it is stopped, only /launcher/ stays reachable and the
; root route returns nginx's 502 until it is launched again (enabled apps are
; restored from /workspace/.devbox/apps.json by the control API on boot).
[program:openchamber]
# Resolve through devbox-user-env so updates installed in /workspace/.local
# replace the image seed after the next Launcher restart.
command=/usr/local/bin/devbox-user-env openchamber serve --foreground --port 9100
user=user
directory=/workspace
environment=HOME="/workspace",XDG_RUNTIME_DIR="/run/user/1000"
autostart=false
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
