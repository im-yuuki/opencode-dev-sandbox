; Xvnc + LXQt on :1 (runs as user). Stop/start via supervisor restarts
; the foreground wrapper; killasgroup covers Xvnc's session children.
[program:vnc]
command=/usr/local/bin/devbox-user-env /usr/local/sbin/vnc-run.sh
user=user
environment=HOME="/workspace",USER="user",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/user/1000"
autostart=false
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=20
