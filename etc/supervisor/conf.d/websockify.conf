; noVNC static + WebSocket bridge 6080 -> 5901. Starts before VNC is up it will
; exit and supervisor restarts it; dependencies are handled by retrying.
[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5901
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
