; noVNC static + WebSocket bridge 9103 -> 5905 (vnc on display :5). Starts
; before VNC is up it will exit and supervisor restarts it; dependencies are
; handled by retrying.
[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:9103 127.0.0.1:5905
autostart=false
autorestart=true
startsecs=2
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true