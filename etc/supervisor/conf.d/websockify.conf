; noVNC static + WebSocket bridge 9103 -> 5905 (vnc on display :5). Starts
; before VNC is up it will exit and supervisor restarts it; dependencies are
; handled by retrying.
[program:websockify]
command=/usr/local/bin/devbox-user-env /usr/bin/websockify --web /usr/share/novnc 127.0.0.1:9103 127.0.0.1:5905
; Runs as uid 1000 like the rest of the desktop stack: it only needs an
; unprivileged port and a loopback connection to Xvnc, and the Nix-aware
; wrapper must never be applied to a root process.
user=user
environment=HOME="/workspace",XDG_RUNTIME_DIR="/run/user/1000"
autostart=false
autorestart=true
startsecs=2
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true