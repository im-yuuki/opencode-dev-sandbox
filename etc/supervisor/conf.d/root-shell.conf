; Root-shell broker for Cloud Run, where no_new_privs disables setuid sudo.
; Access is restricted by /run/devbox/root-shell.sock ownership/mode.
[program:root-shell]
command=/usr/local/sbin/root-shell-server
user=root
directory=/workspace
environment=HOME="/root",SHELL="/bin/bash",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=1
startretries=5
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
