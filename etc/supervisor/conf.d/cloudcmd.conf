; Cloud Commander file manager. Nginx authenticates /files/ with the DevBox
; session cookie before proxying requests to this loopback-only service.
[program:cloudcmd]
command=/usr/bin/cloudcmd --port 9104 --root /workspace --prefix /files --prefix-socket /files --no-auth --no-console --no-terminal --config-dialog --no-config-auth --no-config-port --editor deepword --columns name-size-date-owner-mode --show-dot-files --show-file-name --no-contact --no-open --no-online --no-export --no-import --no-dropbox --no-log
user=user
directory=/workspace
environment=HOME="/workspace/.devbox/cloudcmd",IP="127.0.0.1",SHELL="/bin/bash",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=false
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
