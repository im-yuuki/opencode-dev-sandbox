; Web terminal for user, loopback only.
[program:ttyd]
command=/usr/local/bin/ttyd --port 7681 --interface 127.0.0.1 --writable --base-path /terminal /bin/bash -l
user=user
directory=/workspace
environment=HOME="/workspace",TERM="xterm-256color",XDG_RUNTIME_DIR="/run/user/1000",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=8
