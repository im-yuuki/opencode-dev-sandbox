# FileBrowser Quantum v1.5.1-stable -- seed config, copied to
# /workspace/.devbox/filebrowser/config.yaml on first run only. Once that file
# exists the entrypoint never rewrites it, so anything the user edits there
# survives an image upgrade.
#
# Schema note: keys follow the upstream v1.5.1-stable `Settings` struct
# (backend/common/settings/structs.go + auth.go). Notably `server.sources` is a
# list, and permissions live under `userDefaults.account.permissions`.

server:
  # Loopback only. There is no internal authentication (see auth.methods.noauth
  # below), so the opencode-dev-sanbox nginx/PAM session gate is the *only* thing standing in
  # front of the filesystem. Port 9104 must never be published.
  listen: "127.0.0.1"
  port: 9104

  # nginx proxies /files/ without stripping the prefix, so FileBrowser has to
  # generate its asset and API URLs under the same path.
  baseURL: "/files"

  database: "/workspace/.devbox/filebrowser/database.db"
  cacheDir: "/workspace/.devbox/filebrowser/cache"

  sources:
    - path: "/workspace"
      name: "Workspace"
      config:
        defaultEnabled: true

  # The launcher already surfaces its own update story; nothing here should
  # phone home from a sandbox that may be offline.
  disableUpdateCheck: true

auth:
  methods:
    # Single-user trusted opencode-dev-sanbox: a second password in front of the file manager
    # would add no isolation (same uid as the agent) and would break the
    # single-sign-on feel of the launcher.
    noauth: true

frontend:
  name: "opencode-dev-sanbox Workspace"
  disableUsedPercentage: false

userDefaults:
  listing:
    # Dotfiles hidden by default so .devbox (TLS key, CLIProxy management key,
    # OAuth tokens) does not show up unprompted. A view-level default only: the
    # user can toggle it in the UI, and this is not a security boundary --
    # FileBrowser, the agent and CLIProxyAPI all run as uid 1000 and can read
    # those files regardless. Source-level ignore rules are deliberately not
    # used, since those would also drop .git and friends from the search index.
    showHidden: false
    viewMode: "list"
  account:
    permissions:
      # Everything the file manager needs: download, upload/create, modify,
      # delete, archive/extract (covered by modify+create+delete) and the
      # realtime/SSE channel the UI uses for live directory updates.
      admin: true
      api: true
      modify: true
      create: true
      delete: true
      download: true
      realtime: true
      # No public share exception: every /files/ URL, share links included,
      # stays behind the opencode-dev-sanbox session gate.
      share: false
