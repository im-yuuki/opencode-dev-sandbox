panels=panel1

[panel1]
plugins=fancymenu,desktopswitch,quicklaunch,taskbar,statusnotifier,tray,mount,volume,worldclock,showdesktop
position=Bottom
desktop=0

[fancymenu]
type=fancymenu
alignment=Left
ownIcon=true
icon=/usr/share/lxqt/graphics/helix_blue_shadow.png
filterClear=true
autoSel=true
autoSelDelay=150

[desktopswitch]
type=desktopswitch

[quicklaunch]
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/google-chrome.desktop
apps\size=3
type=quicklaunch
alignment=Left

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
