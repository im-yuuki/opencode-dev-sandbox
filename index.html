<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevBox Launcher</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f14; --panel:#14161d; --line:#232836; --text:#e7eaf0; --muted:#8b94a7; --accent:#4c8bf5; --ok:#3fb97a; --bad:#e5484d; --warn:#e0a13c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 70% -10%, #16213f 0%, var(--bg) 55%); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:44px 28px 8px; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.3px; }
  p.sub { margin:6px 0 0; color:var(--muted); font-size:.95rem; }
  .hint { max-width:1080px; margin:16px 28px 0; padding:10px 14px; border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; color:var(--muted); font-size:.8rem; }
  .hint code { background:#0b0d12; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .grid { max-width:1080px; margin:24px auto 0; padding:0 28px 60px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  a.card { display:flex; flex-direction:column; gap:12px; padding:20px; background:var(--panel); border:1px solid var(--line);
           border-radius:14px; text-decoration:none; color:inherit; transition:transform .15s,border-color .15s,background .15s; }
  a.card:hover { transform:translateY(-3px); border-color:var(--accent); background:#181c26; }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .icon { width:44px; height:44px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg,#243047,#1a2233); }
  .tag { font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .name { font-size:1.15rem; font-weight:650; }
  .desc { color:var(--muted); font-size:.86rem; line-height:1.5; flex:1; }
  .status { display:flex; align-items:center; gap:7px; font-size:.78rem; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); animation:pulse 1.6s infinite; }
  .dot.ok { background:var(--ok); animation:none; }
  .dot.bad { background:var(--bad); animation:none; }
  @keyframes pulse { 50% {opacity:.35;} }
  .keys { color:var(--muted); font-size:.72rem; display:flex; gap:8px; flex-wrap:wrap; }
  kbd { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem; background:#0b0d12; border:1px solid var(--line); border-bottom-width:2px; padding:2px 7px; border-radius:6px; color:var(--muted); }
  svg { width:24px; height:24px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<header>
  <h1>DevBox</h1>
  <p class="sub">Debian Trixie &middot; KDE Plasma 6 &middot; Docker-in-Docker &middot; opencode &middot; Cockpit</p>
</header>

<div class="hint">Everything is gated by HTTP Basic Auth. OpenChamber and Cockpit also ask for their own password on top — all of them use your <code>WEB_PASSWORD</code>.</div>

<div class="grid" id="grid"></div>

<script>
const CARDS = [
  {
    name:"OpenChamber", icon:"chat", tag:"Studio",
    desc:"OpenCode sessions, diffs, git workflows and the code editor. The main studio.",
    url:"/", key:"s",
    check:async()=>{ const r=await fetch("/api/system/info",{cache:"no-store"}); if(!r.ok) throw 0; const j=await r.json(); return {ok:true, text:"v"+j.openchamberVersion}; }
  },
  {
    name:"Desktop (noVNC)", icon:"monitor", tag:"Desktop",
    desc:"KDE Plasma session streamed to your browser. Wayland-free X11 for safety.",
    url:"/vnc/vnc.html?path=vnc/websockify&resize=remote", key:"d",
    check:async()=>{ const r=await fetch("/vnc/vnc.html",{cache:"no-store"}); return {ok:r.ok, text:r.ok?"available":"unreachable"}; }
  },
  {
    name:"Cockpit", icon:"server", tag:"Admin",
    desc:"System admin, services, logs and a web terminal. Log in as your dev user.",
    url:"/cockpit/", key:"c",
    check:async()=>{ const r=await fetch("/cockpit/",{cache:"no-store"}); return {ok:r.ok, text:r.ok?"up":"unreachable"}; }
  },
  {
    name:"Terminal", icon:"terminal", tag:"Shell",
    desc:"Dedicated web terminal as your dev user, independent of Cockpit.",
    url:"/terminal/", key:"t",
    check:async()=>{ const r=await fetch("/terminal/",{cache:"no-store"}); return {ok:r.ok, text:r.ok?"up":"unreachable"}; }
  }
];

const ICONS = {
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  server:'<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
  terminal:'<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'
};

const grid = document.getElementById("grid");

function renderCard(c){
  const a = document.createElement("a");
  a.className = "card"; a.href = c.url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML =
    '<div class="head"><span class="icon"><svg viewBox="0 0 24 24">'+ICONS[c.icon]+'</svg></span><span class="tag">'+c.tag+'</span></div>'+
    '<div class="name">'+c.name+'</div>'+
    '<div class="desc">'+c.desc+'</div>'+
    '<div class="status"><span class="dot"></span><span class="stxt">checking…</span></div>'+
    '<div class="keys">press <kbd>Shift+'+c.key.toUpperCase()+'</kbd></div>';
  grid.appendChild(a);
  return a;
}

async function status(el, c){
  const dot = el.querySelector(".dot"), txt = el.querySelector(".stxt");
  try {
    const s = await c.check();
    dot.className = "dot " + (s.ok ? "ok" : "bad");
    txt.textContent = s.ok ? ("online" + (s.text ? " · "+s.text : "")) : "unreachable";
  } catch {
    dot.className = "dot bad";
    txt.textContent = "unreachable";
  }
}

CARDS.forEach(c => status(renderCard(c), c));

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const c = CARDS.find(x => x.key === k);
  if (c) { e.preventDefault(); window.open(c.url, "_blank"); }
});
</script>
</body>
</html>
