<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DevBox</title>
    <script>
      // System theme sync, before first paint (no flash).
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.classList.toggle("dark", mq.matches);
          document.documentElement.style.colorScheme = mq.matches ? "dark" : "light";
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2'><rect x='2' y='3' width='20' height='14' rx='2'/><line x1='8' y1='21' x2='16' y2='21'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
