<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Launcher | OpenCode DevBox</title>
    <script>
      // System theme sync, before first paint (no flash).
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.classList.toggle("dark", mq.matches);
          document.documentElement.style.colorScheme = mq.matches ? "dark" : "light";
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/launcher/favicon-launcher.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
