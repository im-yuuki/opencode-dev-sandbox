<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Launcher | OpenCode DevBox</title>
    <script>
      // Theme sync, before first paint (no flash). System remains the default;
      // an explicit light/dark choice is stored only in this browser.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var stored = null;
          try {
            stored = window.localStorage.getItem("devbox-theme");
          } catch (_) {}
          var isDark = stored === "dark" || (stored !== "light" && mq.matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/launcher/favicon-launcher.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
